<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Registro de Pacientes</h2>
    </div>

    <div class="card-body">

      <form>

        <div class="mb-3">
          <label class="form-label">Nombre:</label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="Ingrese el nombre"
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Edad:</label>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="edad"
            name="edad"
            placeholder="Ingrese la edad"
          >
        </div>

        <button
          type="button"
          class="btn btn-primary"
          (click)="registrar()"
        >
          Registrar paciente
        </button>

      </form>

    </div>

  </div>

</div>
