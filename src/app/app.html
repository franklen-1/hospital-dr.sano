<app-formulario></app-formulario>

<div class="container mt-4">

  <h2 class="mb-3">Lista de pacientes</h2>

  @for (paciente of pacientes(); track $index) {

    <div class="card mb-3">

      <div class="card-body">

        <h5 class="card-title">
          {{ paciente.nombre }}
        </h5>

        <p class="card-text">
          Edad: {{ paciente.edad }} años
        </p>

      </div>

    </div>

  }

</div>
